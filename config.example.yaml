# FamilyRecorder configuration for an XVF3800 USB Audio Class device.
audio:
  # Matching is case-insensitive. FamilyRecorder also scores "XVF3800", "XMOS",
  # "USB" and "array" when this exact substring is unavailable.
  device_name_contains: "XVF3800"
  device_id: null
  allow_default_input: false
  sample_rate: 16000
  channels: 1
  chunk_seconds: 30
  retry_seconds: 10

vad:
  enabled: true
  aggressiveness: 2
  frame_ms: 30
  min_speech_ratio: 0.08
  min_rms_dbfs: -48.0

whisper:
  binary_path: "~/Library/Application Support/FamilyRecorder/whisper.cpp/build/bin/whisper-cli"
  model_path: "~/Library/Application Support/FamilyRecorder/whisper.cpp/models/ggml-large-v3-turbo.bin"
  language: "zh"
  threads: 8
  initial_prompt: "以下是繁體中文家庭對話，可能包含英文技術名詞與人名。"
  extra_args: []

storage:
  data_dir: "~/xvf3800-listener-data"
  keep_audio_days: 7
  delete_audio_after_transcription: false

# Optional, approximate household-speaker labels. Add names from the menu bar,
# then let each person intentionally record a short enrollment sample. The
# enrollment WAV is discarded; only a local acoustic feature profile is kept.
speakers:
  enabled: false
  members: []
  min_similarity: 0.82
  min_margin: 0.025
  dominance_threshold: 0.65

summary:
  enabled: true
  # Uses the official Codex CLI and its saved "Sign in with ChatGPT" session.
  # No OpenAI API key is read or accepted by FamilyRecorder.
  provider: "codex"
  # Empty means the default model available to the signed-in ChatGPT account.
  model: ""
  # "codex" searches PATH and common macOS locations, including ChatGPT.app.
  codex_binary_path: "codex"
  timeout_seconds: 900
  hour: 0
  minute: 10
  max_input_chars: 300000
  prompt: |
    你是家庭聲音日誌整理助手。輸入是本地端語音辨識產生的逐段文字，
    可能有錯字、重複、背景音或無意義片段。只根據逐字稿內容整理，
    不得補造人物、事件、關係或結論。請輸出繁體中文 Markdown，包含：

    1. 事件時間軸（按來源時間先後排列，每項標示「約 HH:MM」）
    2. 家庭成員重點（依逐字稿的「可能說話者」分組）
    3. 今日重要消息（每項保留約略時間與可能說話者）
    4. 決策與承諾（每項保留約略時間與可能說話者）
    5. 待辦事項（如可辨識，分開標示可能說話者、負責人、約略時間與期限）
    6. 值得追蹤的想法或靈感（每項保留約略時間與可能說話者）
    7. 人名、專案名、產品名等關鍵實體
    8. 可能辨識錯誤或需要人工確認的片段
    9. 100 字內今日摘要

    時間以逐字稿標題中的本地時間為準，只取到分鐘。不可把 30 秒片段的
    起始秒數視為事件精確發生時間；無法對應來源段落時標示「時間不明」，
    不得自行推測。

    不要輸出無關的閒聊流水帳。逐字稿若含「可能：某人」標記，盡可能在
    事件、重要消息、決策、待辦與想法中保留為「可能說話者：某人」，但僅把它
    視為本機近似辨識結果，不可把人別當成已確認事實。可能多人、不確定或
    未標記的片段不得硬分配給任何成員；說話者與待辦負責人也不得混為一談。

placement_test:
  recording_seconds_per_sentence: 8
  sentences_file: ""
